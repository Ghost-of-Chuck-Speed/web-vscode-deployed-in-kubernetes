---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
     nginx.ingress.kubernetes.io/redirect-path: /
spec:
  ingressClassName: nginx
  rules:
    {{- range $i := until (int .Values.developerCount) }}
    - host: "{{ $.Values.nginx.domain }}"
      http:
        paths:
          - path: /developer{{ add $i 1 }}
            pathType: Prefix
            backend:
              service:
                name: code-server-developer{{ add $i 1 }}
                port:
                  number: 80
    {{- end }}

---
# Persistent Volume for Shared Storage
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-pv
spec:
  capacity:
    storage: {{ .Values.sharedStorageSize }}
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /mnt/shared-storage 

---
# Persistent Volumes for Developers
{{- range $i := until (int .Values.developerCount) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: developer{{ add $i 1 }}-pv
spec:
  capacity:
    storage: {{ $.Values.individualStorageSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/developer{{ add $i 1 }}
{{- end }}

---
# Persistent Volume Claims for Developers
{{- range $i := until (int .Values.developerCount) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: developer{{ add $i 1 }}-pvc
  namespace: {{ $.Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $.Values.individualStorageSize }}
{{- end }}

---
# Persistent Volume Claims for Shared Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sharedStorageSize }}

---
# Deployments and Services for Each Developer
{{- range $i := until (int .Values.developerCount) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server-developer{{ add $i 1 }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server-developer{{ add $i 1 }}
  template:
    metadata:
      labels:
        app: code-server-developer{{ add $i 1 }}
    spec:
      containers:
      - name: code-server
        image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
        ports:
        - containerPort: 8443
        env:
        - name: PASSWORD
          value: "password"
        volumeMounts:
        - mountPath: /path/to/developer-storage
          name: developer-storage
        - mountPath: /path/to/shared
          name: shared-storage
      volumes:
      - name: developer-storage
        persistentVolumeClaim:
          claimName: developer{{ add $i 1 }}-pvc
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: code-server-developer{{ add $i 1 }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8443
  selector:
    app: code-server-developer{{ add $i 1 }}
{{- end }}
